<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="animalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Sky -->
  <rect width="32" height="20" fill="url(#skyGradient)" rx="2"/>
  
  <!-- Ground -->
  <rect y="20" width="32" height="12" fill="url(#grassGradient)" rx="2"/>
  
  <!-- Grass blades -->
  <path d="M4 20 L4 18 L5 16 L6 18 L6 20" fill="#16a34a" opacity="0.8"/>
  <path d="M8 20 L8 17 L9 15 L10 17 L10 20" fill="#16a34a" opacity="0.8"/>
  <path d="M24 20 L24 18 L25 16 L26 18 L26 20" fill="#16a34a" opacity="0.8"/>
  <path d="M28 20 L28 17 L29 15 L30 17 L30 20" fill="#16a34a" opacity="0.8"/>
  
  <!-- Animal (Fox-like) -->
  <ellipse cx="16" cy="18" rx="4" ry="2.5" fill="url(#animalGradient)"/>
  <!-- Head -->
  <circle cx="16" cy="14" r="3" fill="url(#animalGradient)"/>
  <!-- Ears -->
  <ellipse cx="14" cy="12" rx="1" ry="1.5" fill="url(#animalGradient)"/>
  <ellipse cx="18" cy="12" rx="1" ry="1.5" fill="url(#animalGradient)"/>
  <!-- Eyes -->
  <circle cx="15" cy="14" r="0.5" fill="#1f2937"/>
  <circle cx="17" cy="14" r="0.5" fill="#1f2937"/>
  <!-- Nose -->
  <circle cx="16" cy="15.5" r="0.3" fill="#1f2937"/>
  <!-- Tail -->
  <ellipse cx="12" cy="18" rx="2" ry="1" fill="url(#animalGradient)" transform="rotate(-20 12 18)"/>
  
  <!-- Sun -->
  <circle cx="26" cy="6" r="3" fill="#fbbf24" opacity="0.9"/>
  <path d="M26 2 L26 4 M30 6 L28 6 M28.8 3.2 L27.4 4.6 M28.8 8.8 L27.4 7.4" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
  
  <!-- Clouds -->
  <ellipse cx="8" cy="8" rx="2" ry="1" fill="#e5e7eb" opacity="0.8"/>
  <ellipse cx="10" cy="8" rx="1.5" ry="0.8" fill="#e5e7eb" opacity="0.8"/>
  <ellipse cx="6" cy="8" rx="1.5" ry="0.8" fill="#e5e7eb" opacity="0.8"/>
  
  <!-- Trees in background -->
  <rect x="2" y="12" width="1" height="8" fill="#92400e"/>
  <circle cx="2.5" cy="12" r="2" fill="#16a34a" opacity="0.7"/>
  
  <rect x="29" y="14" width="1" height="6" fill="#92400e"/>
  <circle cx="29.5" cy="14" r="1.5" fill="#16a34a" opacity="0.7"/>
</svg>
